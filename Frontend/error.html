<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong · Aama ko Agro</title>
<style>
  :root{
    --ink:#1c2b22;
    --ink-soft:#5b6b61;
    --brand:#2f6b3f;
    --brand-dark:#245a33;
    --bg:#f7f5ef;
    --card:#ffffff;
    --line:#e6e2d6;
    --err:#b3261e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#eef3ec 0%,var(--bg) 28%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:100vh;
  }
  .err-card{
    max-width:560px;width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 18px 50px rgba(28,43,34,.12);
    padding:44px 40px 40px;text-align:center;
  }
  .err-icon{
    width:84px;height:84px;margin:0 auto 20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:36px;
  }
  .err-icon.severity-error{background:#fdeaea;color:var(--err);}
  .err-icon.severity-warning{background:#fbf0d9;color:#a3671a;}
  .err-badge{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--brand);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:14px;
  }
  h1{font-size:32px;line-height:1.15;margin-bottom:12px;font-weight:800;}
  p.msg{color:var(--ink-soft);font-size:15.5px;line-height:1.6;margin-bottom:26px;}
  .err-code{
    font-size:12.5px;color:var(--ink-soft);
    border-top:1px solid var(--line);padding-top:18px;margin-bottom:24px;word-break:break-word;
  }
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;font-weight:600;font-size:15px;
    border-radius:12px;padding:13px 22px;min-width:150px;transition:.15s ease;
  }
  a.btn-primary{background:var(--brand);color:#fff;}
  a.btn-primary:hover{background:var(--brand-dark);}
  a.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  a.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
  .err-nav{margin-bottom:22px;}
  .err-nav a{
    display:inline-block;color:var(--brand);font-weight:600;font-size:14px;
    text-decoration:none;margin:0 8px;
  }
  .err-nav a:hover{text-decoration:underline;}
  .brand{margin-bottom:8px;font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--brand);}
  @media (max-width:480px){
    .err-card{padding:34px 22px;}
    .actions a{width:100%;}
  }
</style>
</head>
<body>
  <div class="err-card" role="alert">
    <div class="brand">आमाको एग्रो · Aama ko Agro</div>
    <div class="err-icon" id="errIcon">⚠️</div>
    <span class="err-badge" id="errType">Page not found</span>
    <h1 id="errTitle">This page seems to be lost.</h1>
    <p class="msg" id="errMsg">The link may be broken, or the page may have moved. Let's get you back on track.</p>
    <div class="err-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="journal.html">Learn</a>
      <a href="wholesale.html">Wholesale</a>
      <a href="signin.html">Sign in</a>
    </div>
    <div class="actions">
      <a href="index.html" class="btn btn-primary" id="retryBtn">Reload</a>
      <a href="shop.html" class="btn btn-ghost">Back to Shop</a>
    </div>
    <div class="err-code" id="errCode">Aama ko Agro</div>
  </div>
<script>
    (function(){
      'use strict';
      // context: error page is served with ?code=404|500|offline&type=...&msg=...&url=...
      function q(name){
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : '';
      }
      var code = (q('code') || '404').toLowerCase();
      var type = q('type') || '';
      var msg  = q('msg')  || '';
      var url  = q('url')  || '';

      var icon = document.getElementById('errIcon');
      var badge = document.getElementById('errType');
      var title = document.getElementById('errTitle');
      var body = document.getElementById('errMsg');
      var codeEl = document.getElementById('errCode');
      var retry = document.getElementById('retryBtn');

      var isServer = code === '500' || code === '502' || code === '503' || code === '504';
      var isOffline = code === 'offline' || code === 'network' || code === '0';
      var is404 = code === '404' || (!isServer && !isOffline);

      if (isServer) {
        icon.textContent = '🛠️';
        icon.className = 'err-icon severity-error';
        badge.textContent = 'Server error';
        title.textContent = 'Something went wrong on our side.';
        body.textContent = msg || 'Our servers hit an unexpected problem while processing your request. Please try again in a moment.';
      } else if (isOffline) {
        icon.textContent = '📡';
        icon.className = 'err-icon severity-warning';
        badge.textContent = 'Connection problem';
        title.textContent = 'We couldn\u2019t reach our servers.';
        body.textContent = msg || 'Please check your internet connection and try again.';
      } else {
        icon.textContent = '🧭';
        icon.className = 'err-icon severity-warning';
        badge.textContent = 'Not found';
        title.textContent = 'This page seems to be lost.';
        body.textContent = msg || 'The link may be broken, or the page may have moved.';
      }

      if (type) badge.textContent = type;
      if (isOffline) {
        retry.textContent = 'Try again';
        retry.href = url ? url : 'shop.html';
        retry.addEventListener('click', function (e) {
          e.preventDefault();
          if (navigator.onLine === false) { body.textContent = 'You are still offline \u2014 reconnect and hit retry again.'; }
          else { location.href = url ? url : 'shop.html'; }
        });
      } else if (url) {
        retry.textContent = 'Try again';
        retry.href = url;
      }

      var shown = [];
      if (code && code !== '404') shown.push('Code: ' + code.toUpperCase());
      if (url) shown.push('Where you were: ' + url);
      codeEl.textContent = shown.join(' · ') || 'Aama ko Agro';
      document.title = badge.textContent + ' · Aama ko Agro';
    })();
  </script>
</body>
</html>
