# Render Blueprint — Aamako Agro API (NestJS + Prisma on Supabase Postgres)
# Deploy via Render Dashboard → "New +" → "Blueprint" → select this repo.
# Working directory is Backend/ so build/start run from the API package.
#
# IMPORTANT — the `name` below determines the public subdomain:
#   Aamako-Agro  →  https://aamako-agro.onrender.com
# That literal host is hardcoded in:
#   • Frontend/vercel.json  (rewrites /api/* → the Render API, same-origin)
#   • Dashboard env NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL
# Renaming this service requires updating both, or the storefront's /api/*
# calls 404. Keep `name` identical to the deployed service so a Blueprint
# sync updates it in place instead of creating a second service.

services:
  - type: web
    name: Aamako-Agro
    runtime: node
    plan: free
    rootDir: Backend
    # Render injects the service env vars (including NODE_ENV=production) at
    # BUILD time too. Under NODE_ENV=production npm omits devDependencies, which
    # would remove @nestjs/cli + typescript + prisma and break `nest build`.
    # `--include=dev` keeps the toolchain available for the build step only.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # NOTE: this repo has no prisma/migrations history (schema is synced with
    # `prisma db push`), so `migrate deploy` would be a silent no-op and the
    # password_reset_tokens table would never be created in production.
    # `db push` is idempotent — it creates missing tables and leaves existing
    # ones untouched.
    #
    # Do NOT pass `--accept-data-loss`: the flag is boolean, and the CLI's
    # parser (arg) treats ANY value — including `=false` — as "true", which
    # would silently authorise destructive drops during a production deploy.
    # Omitting it keeps the safe default: refuse to push a destructive change.
    startCommand: npx prisma db push --skip-generate && npm run start
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Pin the Node runtime to match "engines": { "node": "24.x" } in
      # Backend/package.json. Render otherwise picks its own default, which can
      # drift from the version used for local dev and the Vercel builds.
      - key: NODE_VERSION
        value: "24"
      # Supabase Postgres (see Backend/.env.supabase.example).
      # Use the connection-pooled URL for runtime (port 6543, pgbouncer=true):
      - key: DATABASE_URL
        sync: false
      # Direct (non-pooled) connection for Prisma Migrate (port 5432).
      # Supabase Dashboard → Database → Connection string → "Session" (port 5432),
      # or use the direct URL form: postgresql://postgres.<ref>:<pw>@db.<region>.supabase.co:5432/postgres
      - key: DIRECT_URL
        sync: false
      # Generate strong ones, e.g. `openssl rand -hex 32` — never use defaults.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "30"
      # Google Sign-In (storefront + dashboard) — leave empty to disable.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Comma-separated allowed frontend origins (no wildcards allowed by the API).
      # With the Vercel /api proxy the apps are same-origin, so set this to the
      # Vercel app URLs to be safe if any client calls Render directly.
      - key: CORS_ORIGINS
        sync: false
      # Public API URL for absolute links in emails / media. Set this to your
      # Render service URL, e.g. https://aamako-agro.onrender.com/api
      - key: PUBLIC_API_URL
        sync: false
      # Password-reset link origin (storefront-only reset page).
      - key: FRONTEND_URL
        sync: false
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      # Email via Resend — leave RESEND_API_KEY empty to keep the log
      # provider (reset tokens are redacted from logs and a CRITICAL warning
      # is logged). Set it + RESEND_FROM_EMAIL / RESEND_FROM_NAME to send
      # real email. No code changes needed.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false